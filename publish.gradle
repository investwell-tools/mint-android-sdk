def sdkVersion = "2.2.0aar"
def sdkArtifactFile = layout.projectDirectory.file("libs/mint-${sdkVersion}.aar").asFile
def githubPackagesUser = System.getenv("GITHUB_USER") ?: project.findProperty("gpr.user") ?: ""
def githubPackagesToken = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""


publishing {

    publications {

        release(MavenPublication) {

            groupId = "com.investwell.tools"
            artifactId = "mint-sdk"
            version = sdkVersion

            artifact(sdkArtifactFile) {
                extension = "aar"
            }

            pom {

                name.set("mint-android-sdk")
                description.set("Mint Android SDK")
                packaging = "aar"
            }
        }
    }

    repositories {

        maven {

            name = "GitHubPackages"

            url = uri("https://maven.pkg.github.com/investwell-tools/mint-android-sdk")

            credentials {

                username = githubPackagesUser
                password = githubPackagesToken
            }
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    doFirst {
        if (!sdkArtifactFile.isFile()) {
            throw new GradleException("AAR not found: ${sdkArtifactFile}")
        }

        if (repository.name == "GitHubPackages") {
            if (githubPackagesUser.trim().isEmpty() || githubPackagesToken.trim().isEmpty()) {
                throw new GradleException("GitHub Packages credentials are missing. Set gpr.user/gpr.key in local gradle.properties or set GITHUB_USER/GITHUB_TOKEN.")
            }
        }
    }
}
