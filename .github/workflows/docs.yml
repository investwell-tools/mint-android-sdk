name: Build and Deploy Documentation

on:
  push:
    branches:
      - main

# Required so GitHub Actions has permission to push the site to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Java & Dokka Setup ---
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install gradle -y

      - name: Generate Dokka API Docs
        run: gradle dokkaHtml

      - name: Copy API Docs
        run: |
          mkdir -p docs/api
          cp -r build/dokka/html/* docs/api/

      # --- 2. Python & MkDocs Setup ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            pip install mkdocs mkdocs-material
          fi

      # --- 3. Build and Push to gh-pages branch ---
      - name: Deploy Documentation
        run: mkdocs gh-deploy --force