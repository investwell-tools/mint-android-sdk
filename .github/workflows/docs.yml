name: Deploy Docs (GitHub Pages)

on:
  push:
    branches:
      - main

# These permissions are required for the modern GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Steps from incoming branch (Dokka API Generation) ---
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install gradle -y

      - name: Generate Dokka API Docs
        run: gradle dokkaHtml

      - name: Copy API Docs
        run: |
          mkdir -p docs/api
          cp -r build/dokka/html/* docs/api/

      # --- Steps from HEAD (MkDocs Build & Artifact Upload) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            pip install mkdocs mkdocs-material
          fi

      - name: Build Documentation
        run: mkdocs build --strict

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4